name: XAUUSD Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y wget gnupg unzip
        pip install pandas numpy requests flask scikit-learn schedule yfinance python-dotenv
        pip install undetected-chromedriver selenium selenium-stealth fake-useragent webdriver-manager
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_ENABLED: "true"
      run: |
        python main.py
